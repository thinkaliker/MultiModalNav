name = "multimodalnav"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"

# Secrets (set with `wrangler pages secret put <NAME>` or in the dashboard):
#   APP_PASSWORD     password required to use the /api endpoints
#   TOMTOM_API_KEY   TomTom Routing API key (traffic-aware drive times)
#   TRANSITOUS_CONTACT  your email or URL, sent to Transitous in the User-Agent
# For local dev, copy .dev.vars.example to .dev.vars.

# Free-tier limits shown in the usage footer. TomTom calls stop at the monthly limit
# (drive times fall back to estimates); the Transitous figure is a guideline and is only shown.
[vars]
TOMTOM_MONTHLY_LIMIT = "20000"
TRANSITOUS_DAILY_LIMIT = "720"
# Shared across all clients (needs USAGE_DB): upstream requests per second per service, and
# requests per minute from any one device.
TOMTOM_MAX_PER_SECOND = "4"
TRANSITOUS_MAX_PER_SECOND = "4"
CLIENT_MAX_PER_MINUTE = "120"

# Usage tracking and shared rate limits (optional; see "Usage database" in the README).
# Either run
#   npx wrangler d1 create multimodalnav-usage --location wnam --binding USAGE_DB --update-config
# which appends the block for you, or create the database in the dashboard, then uncomment
# this block and paste in its Database ID. Tables are created automatically on first use.
# [[d1_databases]]
# binding = "USAGE_DB"
# database_name = "multimodalnav-usage"
# database_id = "<DATABASE_ID>"
