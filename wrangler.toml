name = "multimodalnav"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"

# Secrets (set with `wrangler pages secret put <NAME>` or in the dashboard):
#   APP_PASSWORD     password required to use the /api endpoints
#   TOMTOM_API_KEY   TomTom Routing API key (traffic-aware drive times)
#   MULTIMODALNAV_CONTACT  your email or URL, sent to Transitous and the Private.coffee
#                          Overpass API in the User-Agent
#   NEXTGIS_OVERPASS_KEY, FAIRWAYMAPPER_OVERPASS_KEY  optional Overpass API keys (parking data)
# For local dev, copy .dev.vars.example to .dev.vars.

# Free-tier limits shown in the usage footer. TomTom calls stop at the monthly limit
# (drive times fall back to estimates); the Transitous figure is a guideline and is only shown.
[vars]
TOMTOM_MONTHLY_LIMIT = "20000"
TRANSITOUS_DAILY_LIMIT = "720"
# Parking queries a day to overpass-api.de (its guideline is under 100), across all clients.
OVERPASS_DE_DAILY_LIMIT = "50"
# Parking queries a month to FairwayMapper (its plan allows 2,000), across all clients.
FAIRWAYMAPPER_MONTHLY_LIMIT = "1800"
# Shared across all clients. With the GATE queue: requests in flight at once per service.
# Without it (fallback, needs USAGE_DB): requests started per second per service.
# Either way: requests per minute from any one device.
TOMTOM_MAX_IN_FLIGHT = "2"
TRANSITOUS_MAX_IN_FLIGHT = "3"
TOMTOM_MAX_PER_SECOND = "4"
TRANSITOUS_MAX_PER_SECOND = "4"
CLIENT_MAX_PER_MINUTE = "120"

# Usage tracking and shared rate limits (optional; see "Usage database" in the README).
# Either run
#   npx wrangler d1 create multimodalnav-usage --location wnam --binding USAGE_DB --update-config
# which appends the block for you, or create the database in the dashboard, then uncomment
# this block and paste in its Database ID. Tables are created automatically on first use.
[[d1_databases]]
binding = "USAGE_DB"
database_name = "multimodalnav-usage"
database_id = "cfd58432-b78a-4f88-9586-54e319b86b85"

# Request queue shared by all clients (optional; see "Request queue" in the README).
# Deploy the gate/ Worker first, then uncomment this block. Until then, the D1 limiter is used.
[[durable_objects.bindings]]
name = "GATE"
class_name = "UpstreamGate"
script_name = "multimodalnav-gate"
